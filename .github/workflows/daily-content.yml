name: Daily content

on:
  schedule:
    - cron: "0 14 * * *" # 06:00 PST / 07:00 PDT in Seattle, before the day's study hour
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Pick today's read and Substack, refresh the Claude changelog
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_TZ: ${{ vars.SITE_TZ || 'America/Los_Angeles' }}
        run: node scripts/update-content.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reads.json data/substack-reads.json data/changelog.json
          git diff --cached --quiet || git commit -m "Daily content for $(date -u +%F)"
          git push
      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy from here.
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref ${{ github.ref_name }}
        continue-on-error: true
